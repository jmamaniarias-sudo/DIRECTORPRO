    <script>
      (function () {
        function isExtError(src, msg, stack) {
          var s = String(src || '');
          var st = String(stack || '');
          var m = String(msg || '');
          return (
            s.indexOf('chrome-extension://') === 0 ||
            s.indexOf('moz-extension://') === 0 ||
            st.indexOf('chrome-extension://') !== -1 ||
            (m.indexOf('Cannot set property fetch of #<Window>') !== -1 &&
              (s.indexOf('extension://') !== -1 || st.indexOf('extension://') !== -1))
          );
        }
        window.addEventListener(
          'error',
          function (ev) {
            if (isExtError(ev.filename, ev.message, ev.error && ev.error.stack)) {
              ev.preventDefault();
              ev.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (ev) {
            var r = ev.reason;
            if (r && isExtError('', r.message, r.stack)) {
              ev.preventDefault();
              ev.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <script>
      (function () {
        var BUILD_VERSION = '2026.11.24-v12';
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister();
              });
            });
          }
          if ('caches' in window && window.caches && typeof window.caches.keys === 'function') {
            window.caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                window.caches.delete(key);
              });
            });
          }
          var prev = window.localStorage && window.localStorage.getItem('director_pro_build_version');
          if (window.localStorage) {
            window.localStorage.setItem('director_pro_build_version', BUILD_VERSION);
          }
          if (prev && prev !== BUILD_VERSION && !window.sessionStorage.getItem('director_pro_reloaded_' + BUILD_VERSION)) {
            window.sessionStorage.setItem('director_pro_reloaded_' + BUILD_VERSION, '1');
            window.location.reload();
          }
        } catch (_e) {
          // Ignore storage restrictions in private/iframe contexts
        }
      })();
    </script>
